name: New release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install deps and build
        run: |
          npm ci
          npm run build

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: false
          prerelease: false
          files: |
            README.md
            LICENSE
            dist/**
